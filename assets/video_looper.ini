# video_looper.ini
# Configuration file for process_manager.
# Manages video (mpv) and emulator (retroarch) processes based on rotary encoder channel input.
# Lines that begin with # are comments that will be ignored.
# Uncomment (=activate) a line by removing its preceding # character.

# Process Manager configuration
[process_manager]

# File Reader Location
# Where to find media files.  Can be usb_drive or directory.
# When using usb_drive any USB stick inserted in to the Pi will be automatically
# mounted and searched for media files.
# Alternatively the directory option will search only a specified directory on the SD card.
file_reader = usb_drive
#file_reader = directory

# To play files in random order set this to true
is_random = false
#is_random = true

# Below you can set a wait time (in seconds) that is waited between each video.
wait_time = 0


# Encoder configuration
[encoder]

# Backend for reading channel position.
#   i2c  = real rotary encoder over I2C bus 1 (production)
#   mock = read channel numbers from a FIFO; used by tools/scenario_runner.py
backend = i2c
#backend = mock

# Path to FIFO when backend = mock
mock_fifo = /tmp/mock_encoder.fifo

# Where to persist (frequency_by_band, previous_band) across restarts.
# Absolute path so it doesn't depend on supervisor cwd.
state_file = /var/lib/video_looper/previous_values.pkl


# Logging configuration
[logging]

# When true, looper.relay logs every relay pulse at DEBUG level.
# Off by default — generates a lot of output during fast channel changes.
relay_debug = false


# USB drive file reader configuration
[usb_drive]

# The path to mount new USB drives.  A number will be appended to the path for
# each mounted drive (i.e. /mnt/usbdrive0, /mnt/usbdrive1, etc.).
mount_path = /mnt/usbdrive

# Whether to mount the USB drives as readonly (true) or writable (false).
# Web UI playlist edits write playlist.json into channel folders, so this
# must be false for the UI to function. Existing mounts won't pick up the
# change until remount or replug.
readonly = false


# Directory file reader configuration
[directory]
# The path to search for media when using the directory file reader.
path = /home/pi/video


# MPV player configuration (for video files)
[mpv]

# List of supported file extensions.  Must be comma separated.
extensions = avi, mov, mkv, mp4, m4v, webm, flv, ts

# Sound output: hdmi, local, or alsa
sound = hdmi

# Hardware decoding mode: auto, v4l2m2m, drm, or no
hwdec = auto

# DRM connector for video output (leave empty for auto-detection)
drm_connector =

# DRM mode (resolution + refresh rate). Should match the kernel cmdline
# `video=` setting and the [retroarch] fullscreen size below so the HDMI
# link does not re-train on player handoff. Empty = mpv default (preferred
# EDID mode). Format: WxH@R.
drm_mode = 1280x720@60

# Volume file - reads volume from this file in the media directory
sound_vol_file = sound_volume

# Video stretch - set to true to stretch 4:3 videos to fill screen (no black bars)
# Default is false to preserve original aspect ratio
video_stretch = true

# Extra command line arguments for mpv
extra_args =


# RetroArch player configuration (for NES ROMs)
[retroarch]

# List of supported file extensions
extensions = nes, fds, nsf

# RetroArch core path
core_path = /usr/lib/aarch64-linux-gnu/libretro/nestopia_libretro.so

# Video driver (gl with kms context for DRM/KMS output without X)
video_driver = gl

# Video context driver (kms for headless/SSH operation)
video_context_driver = kms

# Audio driver (alsa for Pi)
audio_driver = alsa

# Input driver (udev for headless/SSH operation)
input_driver = udev

# Run in fullscreen mode
fullscreen = true

# Video scaling - set to false to stretch video to fill screen
video_scale_integer = false

# Force aspect ratio - set to false to allow full stretching (no black bars)
video_force_aspect = false

# Enable audio output
audio_enable = true

# Auto-save state interval in seconds (0 to disable)
autosave_interval = 0

# Automatically load save state when starting a ROM
savestate_auto_load = true

# Verbose logging: pass -v and route RetroArch's own logger to /tmp/retroarch.log
# Useful for debugging crashes — RetroArch's logger fflushes, plain stderr capture doesn't
verbose = true

# Pin the CRTC mode RetroArch requests. Should match [mpv] drm_mode and the
# kernel cmdline `video=` setting so the HDMI link doesn't re-train when
# switching between players. Leave empty to let RetroArch pick automatically.
fullscreen_width = 1280
fullscreen_height = 720
refresh_rate = 60.000000

# Extra command line arguments for RetroArch
extra_args =


# Web UI configuration
[web]

# When true (default) the looper starts a Starlette+uvicorn server in a
# daemon thread alongside the main loop. Set false to disable the UI.
enabled = true

# TCP port. 80 requires running as root (which supervisor already does).
port = 80

# Bind address. 0.0.0.0 = all interfaces; 127.0.0.1 = localhost only.
bind = 0.0.0.0

# File extensions accepted by the picker's upload button. Comma- or
# whitespace-separated; leading dots optional; case-insensitive. If
# empty or missing, falls back to the looper's full playable set
# (avi, mov, mkv, mp4, m4v, webm, flv, ts, nes, fds, nsf).
upload_extensions = avi, mov, mkv, mp4, nes
